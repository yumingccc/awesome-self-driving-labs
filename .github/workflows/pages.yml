# Publishes the pre-built site/ directory to GitHub Pages.
#
# tools/ is not part of this repository, so nothing is built here: regenerate
# the site locally before pushing, with
#
#     python tools/validate.py && python tools/build.py
#
# and commit the updated site/ alongside data/papers.json. A push that only
# changes data/ will deploy the previous build.
name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # enablement: true turns Pages on with the GitHub Actions build type if
      # the repository has not enabled it yet, so the first push succeeds on
      # its own. Without it the step fails on a repository whose Pages source
      # has never been set.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
